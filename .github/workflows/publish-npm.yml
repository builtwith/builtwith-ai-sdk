name: Stage on npm

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to stage
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Run tests
        run: node test/test.js

      - name: Stage on npm
        run: npx --yes npm@11.15.0 stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
